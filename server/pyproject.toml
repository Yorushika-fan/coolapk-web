[project]
name = "coolapk-web-server"
version = "0.1.0"
description = "FastAPI proxy for the Coolapk web client"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "bcrypt>=4.2",
    "pydantic-settings>=2.5",
    "python-dotenv>=1.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["server", "server.coolapk_token"]

[tool.setuptools.package-data]
"server.coolapk_token" = ["*.bin"]
